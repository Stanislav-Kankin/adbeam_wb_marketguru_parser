[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-inn-extractor"
version = "0.1.0"
description = "Research MVP for extracting Wildberries seller INN from MarketGuru Excel exports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1.5,<4.0.0",
  "playwright>=1.52.0,<2.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "httpx>=0.28.1,<1.0.0",
  "selectolax>=0.3.28,<0.4.0",
  "tenacity>=9.1.0,<10.0.0",
  "tldextract>=5.3.0,<6.0.0",
]

[project.scripts]
wb-inn = "wb_inn_extractor.cli:main"
wb-inn-gui = "wb_inn_extractor.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

